<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="霍格沃茨小手机">
<title>霍格沃茨小手机</title>
<style>
/* ===== 五套主题(米白暖黄为万用) ===== */
:root, [data-theme="common"] {
  --bg:#eadfc3; --surface:#f6eed8; --surface2:#ddcfa8; --accent:#d9a72e; --on-accent:#3a2a12;
  --ink:#3a2c1a; --soft:#7d6c53; --line:#cdbb8c; --bar:#e3d6b4; --bar-ink:#3a2c1a;
  --lock:#e9dec2; --lock-ink:#3a2c1a; --today:#c0392b;
  --t0:#1f3a2e; --t1:#6b1f26; --t2:#e6d8b8; --t3:#1c2a3a; --glyph:#d9b768; --glyph2:#4a3a22;
}
[data-theme="hufflepuff"] {
  --bg:#fbeaa8; --surface:#fff6d0; --surface2:#f3d96e; --accent:#f5c400; --on-accent:#3b2412;
  --ink:#4a2f17; --soft:#86683f; --line:#e1c15a; --bar:#5a3a1c; --bar-ink:#ffe680;
  --lock:#f6dc7a; --lock-ink:#4a2f17; --today:#a8561a;
  --t0:#5a3a1c; --t1:#8a5a1f; --t2:#fff0b0; --t3:#3b2412; --glyph:#ffd84a; --glyph2:#4a2f17;
}
[data-theme="slytherin"] {
  --bg:#16322a; --surface:#1f4538; --surface2:#2a5646; --accent:#c9a94d; --on-accent:#1a2b22;
  --ink:#eadfb8; --soft:#a9b79a; --line:#36614f; --bar:#0f261f; --bar-ink:#d8c27a;
  --lock:#0f261f; --lock-ink:#d8c27a; --today:#c9a94d;
  --t0:#0f261f; --t1:#2a5646; --t2:#cfd8b0; --t3:#1b3a2f; --glyph:#d8c27a; --glyph2:#16322a;
}
[data-theme="gryffindor"] {
  --bg:#f3dcb4; --surface:#fcecd0; --surface2:#e9c98f; --accent:#f2c230; --on-accent:#4a0f12;
  --ink:#3d1a14; --soft:#8a5a48; --line:#d9b078; --bar:#8e1b22; --bar-ink:#ffe08a;
  --lock:#7a1219; --lock-ink:#ffd966; --today:#8e1b22;
  --t0:#8e1b22; --t1:#5e0f15; --t2:#f6e0b0; --t3:#3d1a14; --glyph:#ffd966; --glyph2:#5e0f15;
}
[data-theme="ravenclaw"] {
  --bg:#dde3ee; --surface:#f0f3f9; --surface2:#c4cde0; --accent:#9fb3d6; --on-accent:#14264a;
  --ink:#1d2a44; --soft:#66738c; --line:#aeb9cf; --bar:#1c3566; --bar-ink:#dfe5f0;
  --lock:#14264a; --lock-ink:#c9d2e3; --today:#1c3566;
  --t0:#1c3566; --t1:#14264a; --t2:#dfe5f0; --t3:#3a4a6a; --glyph:#c9d2e3; --glyph2:#14264a;
}

/* ===== 基础:羊皮纸质感 ===== */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font: 16px/1.55 -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
#app { position: relative; height: 100vh; height: 100dvh; max-width: 480px; margin: 0 auto; overflow: hidden; background-color: var(--bg);
  background-image:
    radial-gradient(ellipse at 50% 40%, transparent 55%, rgba(80,50,10,.16) 100%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .38  0 0 0 0 .28  0 0 0 0 .14  0 0 0 .16 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; }
.scroll { flex: 1; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }
.scroll.flush { padding: 0; }
.soft { color: var(--soft); }
h1, h2, .serif, .clock { font-family: "Songti SC", "Noto Serif SC", "STSong", "SimSun", serif; }
@media (min-width: 560px) {
  body { display: grid; place-items: center; background: #2a2318; }
  #app { height: min(880px, 96vh); width: 400px; border-radius: 38px; border: 9px solid #0e0c09; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
}

/* ===== 顶栏与返回键 ===== */
.bar { display: flex; align-items: center; gap: 10px; background: var(--bar); color: var(--bar-ink);
  padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 10px; border-bottom: 2px solid var(--line); flex: none; }
.bar h1 { flex: 1; margin: 0; font-size: 19px; text-align: center; letter-spacing: 2px; }
.bar-r { min-width: 88px; text-align: right; }
.back { min-width: 88px; height: 42px; padding: 0 14px; border-radius: 12px; font-size: 16px; font-weight: 700;
  background: var(--accent); color: var(--on-accent); border: 2px solid var(--on-accent); box-shadow: 0 3px 0 var(--on-accent); }
.back:active { transform: translateY(3px); box-shadow: none; }

/* ===== 通用控件 ===== */
button { font: inherit; cursor: pointer; }
.btn { background: var(--accent); color: var(--on-accent); border: 2px solid var(--on-accent); border-radius: 12px; padding: 10px 18px; font-weight: 700; }
.btn.big { width: 100%; padding: 14px; font-size: 17px; margin-top: 14px; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.danger { background: #b3382c; color: #fff; border-color: #6d1d15; }
.card { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
.card h3 { margin: 0 0 8px; font-size: 16px; }
.field { display: block; margin-bottom: 12px; }
.field span { display: block; font-size: 13px; color: var(--soft); margin-bottom: 4px; }
input, select, textarea { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; }
textarea { min-height: 84px; resize: vertical; }
.pad { padding: 28px 20px; }
.title { font-size: 36px; line-height: 1.2; margin: 24px 0 8px; }
.tip { font-size: 13px; color: var(--soft); margin-top: 14px; }
.tag { font-size: 12px; background: var(--surface2); border-radius: 8px; padding: 1px 8px; color: var(--soft); }

/* ===== 联系人列表(猫头鹰邮局) ===== */
.contact { display: flex; align-items: center; gap: 14px; padding: 12px 14px; width: 100%; text-align: left; color: var(--ink);
  background: transparent; border: 0; border-bottom: 1px solid var(--line); }
.contact .grow { flex: 1; min-width: 0; }
.contact b { font-size: 18px; font-family: "Songti SC","Noto Serif SC",serif; }
.contact small { display: block; color: var(--soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.av { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 24px; font-weight: 700; flex: none;
  border: 3px solid #7a1f26; box-shadow: 0 0 0 2px var(--surface) inset; font-family: "Songti SC","Noto Serif SC",serif; }
.av.xl { width: 128px; height: 128px; font-size: 56px; margin: 0 auto; }
.star { background: none; border: 0; font-size: 26px; color: var(--soft); padding: 6px; }
.star.on { color: var(--accent); }

/* ===== 提示框:灰色半透明 + 白字 ===== */
#toasts { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 70px); left: 0; right: 0; z-index: 999; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.toast { background: rgba(90,90,90,.8); color: #fff; padding: 9px 16px; border-radius: 12px; font-size: 14px; max-width: 86%; text-align: center; }

/* ===== 入学通知书 ===== */
.stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; min-height: 60vh; }
.env { position: relative; width: 270px; height: 180px; perspective: 700px; margin: 20px auto; }
.env .body { position: absolute; inset: 0; background: var(--surface2); border: 3px solid var(--ink); border-radius: 6px; }
.env .paper { position: absolute; left: 14px; right: 14px; top: 10px; height: 150px; background: var(--surface); border: 2px solid var(--line); transition: transform .9s ease-in-out; }
.env .flap { position: absolute; left: 0; right: 0; top: 0; height: 100px; background: var(--accent); clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: top center; transition: transform .8s ease-in-out; z-index: 2; }
.env .seal { position: absolute; left: 50%; top: 74px; width: 36px; height: 36px; margin-left: -18px; border-radius: 50%; background: #8e1b22; color: #ffe08a; display: grid; place-items: center; font-weight: 700; z-index: 3; border: 2px solid #4a0f12; }
.env.open .flap { transform: rotateX(180deg); }
.env.open .seal { display: none; }
.env.open .paper { transform: translateY(-70px); }
.letter { background: var(--surface); border: 3px double var(--ink); padding: 22px 20px; font-family: "Songti SC","Noto Serif SC","STSong",serif; line-height: 1.85; }
.letter h2 { text-align: center; margin: 0 0 12px; font-size: 22px; }
.hint-tap { animation: bob 1.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-6px); } }

/* ===== 分院 ===== */
.opt { display: block; width: 100%; text-align: left; padding: 14px; margin-bottom: 10px; background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-radius: 12px; font-size: 16px; }
.opt:active { background: var(--accent); color: var(--on-accent); }
.result { text-align: center; padding: 26px 16px; }
.result h2 { font-size: 40px; margin: 8px 0; }

/* ===== 锁屏:整块上推 ===== */
.lockov { position: absolute; inset: 0; z-index: 50; touch-action: none; user-select: none; -webkit-user-select: none;
  background-color: var(--lock); color: var(--lock-ink);
  background-image: radial-gradient(ellipse at 50% 40%, transparent 50%, rgba(60,40,10,.25) 100%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .38  0 0 0 0 .28  0 0 0 0 .14  0 0 0 .16 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  display: flex; flex-direction: column; justify-content: space-between;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) 20px calc(env(safe-area-inset-bottom, 0px) + 26px); }
.lockov .top { display: flex; justify-content: space-between; align-items: center; }
.lockov .back { background: transparent; color: var(--lock-ink); border-color: var(--lock-ink); box-shadow: none; min-width: 80px; }
.owlpost { letter-spacing: 6px; font-size: 13px; font-weight: 700; opacity: .8; }
.motto { font-size: 15px; opacity: .8; margin-bottom: 4px; }
.clock { font-size: 92px; font-weight: 400; line-height: 1; letter-spacing: -2px; }
.lockov .date { margin-top: 12px; font-size: 18px; }
.lockov .swipe { text-align: center; font-size: 15px; }
.lockov .swipe b { display: block; font-size: 34px; line-height: 1; animation: bob 1.3s ease-in-out infinite; }
.lockov .bar-line { width: 130px; height: 5px; border-radius: 3px; background: var(--lock-ink); margin: 12px auto 0; opacity: .75; }

/* ===== 桌面 ===== */
.home { flex: 1; overflow-y: auto; padding: 0 16px 20px; -webkit-overflow-scrolling: touch; }
.owlbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: calc(env(safe-area-inset-top, 0px) + 8px) 0 6px; font-size: 13px; font-weight: 600; }
.owlbar > :last-child { text-align: right; }
.owlbar .back { min-width: 0; height: 34px; padding: 0 10px; font-size: 14px; justify-self: start; }
.homeclock { display: flex; justify-content: space-between; align-items: flex-end; padding: 10px 4px 0; }
.homeclock .clock { font-size: 76px; }
.hdate { text-align: center; line-height: 1.1; padding-bottom: 6px; }
.hdate small { display: block; font-size: 13px; color: var(--soft); }
.hdate b { font-size: 42px; font-family: "Songti SC","Noto Serif SC",serif; }
.metaline { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; letter-spacing: 1px; padding: 8px 4px 12px; color: var(--soft); }
.widget { background: var(--t0); color: var(--glyph); border-radius: 22px; padding: 12px 16px; margin-bottom: 20px; box-shadow: 0 6px 14px rgba(0,0,0,.18); }
.widget h3 { margin: 0 0 6px; font-size: 15px; font-family: "Songti SC","Noto Serif SC",serif; }
.slot { display: flex; gap: 10px; font-size: 14px; padding: 2px 8px; border-radius: 10px; opacity: .8; }
.slot time { width: 48px; flex: none; }
.slot.now { background: var(--glyph); color: var(--t0); font-weight: 700; opacity: 1; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px 4px; }
.app { display: flex; flex-direction: column; align-items: center; gap: 7px; background: none; border: 0; color: var(--ink); font-size: 12px; padding: 0; text-align: center; line-height: 1.25; }
.app .ic { width: 66px; height: 66px; border-radius: 18px; display: grid; place-items: center; box-shadow: 0 4px 8px rgba(0,0,0,.25), inset 0 0 0 2px rgba(255,255,255,.12); }
.app .ic svg { width: 36px; height: 36px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.ic.t0 { background: var(--t0); color: var(--glyph); } .ic.t1 { background: var(--t1); color: var(--glyph); }
.ic.t2 { background: var(--t2); color: var(--glyph2); } .ic.t3 { background: var(--t3); color: var(--glyph); }
.app.dim { opacity: .5; }
.homebar { width: 130px; height: 5px; border-radius: 3px; background: var(--ink); opacity: .6; margin: 22px auto 0; }

/* ===== 聊天 ===== */
.meters { display: flex; gap: 14px; padding: 8px 14px; font-size: 13px; background: var(--surface2); flex: none; }
.meters i { display: inline-block; height: 6px; border-radius: 3px; background: var(--accent); vertical-align: middle; margin-left: 6px; }
.msgs { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.b { max-width: 78%; padding: 9px 13px; border-radius: 16px; word-break: break-word; white-space: pre-wrap; }
.b.me { align-self: flex-end; background: var(--accent); color: var(--on-accent); border-bottom-right-radius: 4px; }
.b.you { align-self: flex-start; background: var(--surface); border: 2px solid var(--line); border-bottom-left-radius: 4px; }
.note { align-self: center; font-size: 12px; color: var(--soft); }
.composer { display: flex; gap: 8px; padding: 10px 12px calc(env(safe-area-inset-bottom, 0px) + 10px); border-top: 2px solid var(--line); background: var(--bg); flex: none; }
.composer input { flex: 1; }

/* ===== 通话 ===== */
.callbody { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px; gap: 8px; }
.cap { min-height: 76px; width: 100%; max-width: 330px; font-size: 16px; padding: 10px 14px; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; margin-top: 14px; }
.replay { margin-top: 8px; background: none; border: 2px solid var(--line); border-radius: 10px; padding: 4px 12px; color: var(--ink); font-size: 14px; }
.ctrls { display: flex; justify-content: center; gap: 18px; padding: 16px 12px; flex: none; flex-wrap: wrap; }
.cbtn { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; color: var(--ink); font-size: 12px; }
.cbtn .c { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; background: var(--surface); border: 2px solid var(--line); }
.cbtn.on .c { background: var(--accent); color: var(--on-accent); border-color: var(--on-accent); }
.cbtn.red .c { background: #c0392b; color: #fff; border-color: #7a1f15; }
.cbtn.green .c { background: #2e9d57; color: #fff; border-color: #17592f; }
.ringing .av { animation: bob 1s ease-in-out infinite; }

/* ===== 日历(仿 iOS 系统日历) ===== */
.ios-cal { flex: 1; overflow-y: auto; padding: 0 0 20px; }
.cal-head { display: flex; justify-content: space-between; align-items: flex-end; padding: 14px 16px 8px; }
.cal-head small { display: block; color: var(--today); font-size: 15px; font-weight: 600; }
.cal-head b { font-size: 34px; line-height: 1.1; }
.cal-nav { display: flex; gap: 6px; align-items: center; }
.cal-nav button { background: none; border: 0; color: var(--today); font-size: 24px; padding: 4px 10px; }
.cal-nav .today-btn { font-size: 16px; font-weight: 600; }
.cal-week, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
.cal-week { padding: 0 4px; text-align: center; font-size: 12px; color: var(--soft); padding-bottom: 6px; }
.cal-grid { padding: 0 4px; }
.cd { height: 58px; border: 0; border-top: 1px solid var(--line); background: none; color: var(--ink); display: flex; flex-direction: column; align-items: center; padding-top: 5px; gap: 3px; }
.cd .n { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; }
.cd.dim .n { opacity: .35; }
.cd.today .n { background: var(--today); color: #fff; font-weight: 700; }
.cd.sel:not(.today) .n { background: var(--ink); color: var(--bg); }
.cd .dot { width: 6px; height: 6px; border-radius: 50%; background: transparent; }
.cd.hol .dot { background: var(--today); }
.cal-events { padding: 14px 16px; border-top: 1px solid var(--line); margin-top: 4px; }
.cal-events h4 { margin: 0 0 8px; font-size: 15px; color: var(--soft); font-weight: 600; }
.evt { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.evt i { width: 4px; border-radius: 2px; background: var(--today); flex: none; }
.evt small { display: block; color: var(--soft); }

/* ===== 外观 ===== */
.row { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; margin-bottom: 10px; width: 100%; text-align: left; color: var(--ink); }
.row .grow { flex: 1; min-width: 0; }
.swatch { display: flex; gap: 4px; }
.swatch i { width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--ink); display: block; }

</style>
</head>
<body>
<div id="app"></div>
<div id="toasts"></div>
<script>
/* 静态数据:学院、分院题、角色、节日、课程表。想改内容,改这里就行。 */

const HOUSES = {
  gryffindor: { name: '格兰芬多', blurb: '勇气、胆识与骑士精神' },
  hufflepuff: { name: '赫奇帕奇', blurb: '忠诚、耐心与公平' },
  ravenclaw:  { name: '拉文克劳', blurb: '智慧、好奇与创造' },
  slytherin:  { name: '斯莱特林', blurb: '野心、机敏与足智多谋' }
};

const THEMES = {
  common:     { name: '万用 · 米白与暖黄',   sw: ['#f3ead7', '#e2a92f'] },
  hufflepuff: { name: '赫奇帕奇 · 明黄与棕', sw: ['#f5c400', '#5a3a1c'] },
  slytherin:  { name: '斯莱特林 · 墨绿与复古黄', sw: ['#16322a', '#c9a94d'] },
  gryffindor: { name: '格兰芬多 · 红与明黄', sw: ['#8e1b22', '#f2c230'] },
  ravenclaw:  { name: '拉文克劳 · 蓝与灰',   sw: ['#1c3566', '#9fb3d6'] }
};

const QUESTIONS = [
  { q: '走廊尽头有一个没人敢打开的旧柜子,你会?',
    o: [['直接打开,看看里面是什么', 'gryffindor'], ['先查查它为什么被封起来', 'ravenclaw'],
        ['叫上朋友一起,有人陪着才安心', 'hufflepuff'], ['先想清楚打开它能换来什么', 'slytherin']] },
  { q: '下面哪种品质最让你自豪?',
    o: [['勇气', 'gryffindor'], ['智慧', 'ravenclaw'], ['忠诚', 'hufflepuff'], ['野心', 'slytherin']] },
  { q: '周末的下午,你更想待在哪里?',
    o: [['魁地奇球场', 'gryffindor'], ['图书馆最里面的角落', 'ravenclaw'],
        ['厨房,和朋友分一盘点心', 'hufflepuff'], ['休息室,和有用的人聊聊', 'slytherin']] },
  { q: '朋友做错了事,你会?',
    o: [['当面直说', 'gryffindor'], ['先弄清楚他为什么这么做', 'ravenclaw'],
        ['陪他一起面对后果', 'hufflepuff'], ['帮他想办法把事情压下去', 'slytherin']] },
  { q: '你希望别人怎么记住你?',
    o: [['一个无畏的人', 'gryffindor'], ['一个有见地的人', 'ravenclaw'],
        ['一个可靠的人', 'hufflepuff'], ['一个了不起的人', 'slytherin']] },
  { q: '只能带走一件魔法物品,你选?',
    o: [['会自己战斗的剑', 'gryffindor'], ['能回答任何问题的书', 'ravenclaw'],

/* 本地存档:全部存在玩家自己浏览器的 localStorage 里。 */
const Store = (() => {
  const KEY = 'hogwarts-phone-v1';
  const defaults = () => ({
    v: 1,
    api: { base: 'https://api.deepseek.com/v1', key: '', model: 'deepseek-chat' },
    card: {}, seenLetter: false, house: null, sortedAt: 0,
    theme: 'common', rel: {}, chats: {}
  });
  function load() {
    const d = defaults();
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const o = JSON.parse(raw);
        return Object.assign(d, o, { api: Object.assign(d.api, o.api || {}) });
      }
    } catch (e) { /* 读取失败就用默认值 */ }
    return d;
  }
  function save(s) {
    try { localStorage.setItem(KEY, JSON.stringify(s)); }
    catch (e) { console.warn('存档失败', e); }
  }
  return { load, save, defaults };
})();

</script>
<script>
/* 调用 OpenAI 兼容接口(DeepSeek 等)。请求直接从玩家浏览器发出,key 不经过任何服务器。 */
const AI = (() => {
  function cardText(card, house) {
    const bits = [];
    if (card.name) bits.push('名字:' + card.name);
    if (card.gender) bits.push('性别:' + card.gender);
    if (card.grade) bits.push('年级:' + GRADES[(+card.grade || 1) - 1]);
    if (house) bits.push('学院:' + HOUSES[house].name);
    ['family:家族', 'appearance:外貌', 'skill:擅长', 'bio:背景'].forEach(p => {
      const [k, label] = p.split(':');
      if (card[k]) bits.push(label + ':' + card[k]);
    });
    return bits.join(';');
  }

  function system(o) {
    const c = o.char, r = o.rel, staff = c.role === 'staff';
    const relText = staff
      ? `你与玩家的信任度为 ${r.trust}/100(教职工对学生只有信任度,没有亲密度)。`
      : `你与玩家的亲密度为 ${r.intimacy}/100,信任度为 ${r.trust}/100。`;
    const style = o.mode === 'call'
      ? '这是电话通话:口语化,最多两句话,不要写括号动作或旁白。'
      : '这是手机聊天:像发消息一样自然,1 到 3 句,不要旁白。';
    return [
      `你正在一个哈利·波特同人手机应用里扮演「${c.name}」。`,
      `人设:${c.persona}`,
      `玩家角色:${cardText(o.card, o.house)}`,
      `现在是:${new Date().toLocaleString('zh-CN')}`,
      relText,
      '规则:',
      '1. 始终保持角色,不要提到自己是 AI 或在扮演。',
      '2. ' + style,
      '3. 根据玩家这句话评估关系变化:友善、尊重、让你开心则上升;冒犯、敷衍、触碰底线则下降;普通寒暄可为 0。变化必须符合你的人设,范围是 -5 到 5 的整数。',
      staff ? '4. 你是教职工,intimacy 必须为 0,只有 trust 会变化。' : '',
      '只输出一个 JSON 对象,不要代码块,格式:{"reply":"你说的话","intimacy":整数,"trust":整数}'
    ].filter(Boolean).join('\n');
  }

  function parse(text) {
    const a = text.indexOf('{'), b = text.lastIndexOf('}');
    if (a >= 0 && b > a) {
      try {
        const j = JSON.parse(text.slice(a, b + 1));
        if (j && typeof j.reply === 'string') return j;
      } catch (e) { /* 落到下面的兜底 */ }
    }
    return { reply: text.trim(), intimacy: 0, trust: 0 };
  }

  async function ask(o) {
    const api = o.api;
    if (!api.key) throw new Error('还没有填写 API Key');
    const msgs = [{ role: 'system', content: system(o) }]
      .concat(o.hist.filter(m => m.r === 'user' || m.r === 'assistant').slice(-16)
        .map(m => ({ role: m.r, content: m.c })));
    const url = api.base.replace(/\/+$/, '') + '/chat/completions';
    let res;
    try {
      res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + api.key },
        body: JSON.stringify({ model: api.model, messages: msgs, temperature: 1.0 })
      });
    } catch (e) {
      throw new Error('网络请求失败:检查 API 地址,或该接口不允许浏览器直接调用(跨域)');
    }
    if (!res.ok) {
      const t = await res.text().catch(() => '');
      throw new Error('接口返回 ' + res.status + (res.status === 401 ? '(Key 不对或已失效)' : '') + ' ' + t.slice(0, 80));
    }
    const data = await res.json();
    const text = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    if (!text) throw new Error('接口没有返回内容');
    return parse(text);
  }

  return { ask };
})();

const WEEK = ['日', '一', '二', '三', '四', '五', '六'];

function toast(msg) {
  const box = document.getElementById('toasts');
  const d = document.createElement('div');
  d.className = 'toast'; d.textContent = msg; box.appendChild(d);
  setTimeout(() => d.remove(), 2800);
}

/* ---------- 路由 ---------- */
function render() {
  timers.forEach(clearInterval); timers = []; beforeBack = null; stopSpeak();
  const cur = stack[stack.length - 1];
  const sc = SCREENS[cur.name](cur.p || {});
  $app.innerHTML = '<div class="screen">' + sc.html + '</div>';
  if (sc.mount) sc.mount($app.firstChild);
}

const root = (name, p) => { stack = [{ name, p: p || {} }]; render(); };

  if (beforeBack) { const f = beforeBack; beforeBack = null; if (f() === false) return; }
  if (stack.length > 1) { stack.pop(); render(); return; }

}

  if (!confirm('退出登录?会清除本机保存的 API Key,下次登录会重新播放入学通知书。游戏进度会保留。')) return;

SCREENS.sort = p => {
  let i = 0; const picks = [];
  return {
    html: header('分院帽') + '<div class="scroll" id="box"></div>',
    mount(el) {
      const box = q(el, '#box');
      beforeBack = () => { if (!picks.length) return true; picks.pop(); i--; draw(); return false; };
      function draw() {
        beforeBack = () => { if (!picks.length) return true; picks.pop(); i--; draw(); return false; };
        const Q = QUESTIONS[i];
        box.innerHTML = `<p class="soft">第 ${i + 1} / ${QUESTIONS.length} 题</p><h2 class="serif">${Q.q}</h2>` +
          Q.o.map((o, n) => `<button class="opt" data-n="${n}">${o[0]}</button>`).join('');
        box.querySelectorAll('.opt').forEach(b => b.onclick = () => {
          picks.push(Q.o[+b.dataset.n][1]); i++;
          if (i >= QUESTIONS.length) finish(); else draw();
        });
      }
      function finish() {
        beforeBack = null;
        const score = {}; picks.forEach(h => score[h] = (score[h] || 0) + 1);
        const max = Math.max(...Object.values(score));
        const top = Object.keys(score).filter(h => score[h] === max);
        const h = top[Math.floor(Math.random() * top.length)];
        S.sortedAt = Date.now();
        if (p.first || !S.house) {
          S.house = h; save();
          box.innerHTML = `<div class="result"><p class="soft">分院帽喊道——</p><h2 class="serif">${HOUSES[h].name}!</h2><p>${HOUSES[h].blurb}</p>
            <button class="btn big" id="enter">进入小手机</button></div>`;
          q(box, '#enter').onclick = () => root('lock');
        } else if (h === S.house) {
          save();
          box.innerHTML = `<div class="result"><p class="soft">分院帽再次喊道——</p><h2 class="serif">${HOUSES[h].name}!</h2><p>你仍然属于${HOUSES[h].name}。</p>
            <button class="btn big" id="ok">好的</button></div>`;
          q(box, '#ok').onclick = back;
        } else {
          save();
          box.innerHTML = `<div class="result"><p class="soft">这一次,分院帽想把你分进——</p><h2 class="serif">${HOUSES[h].name}</h2>
            <p>要转入${HOUSES[h].name},还是留在${HOUSES[S.house].name}?</p>
            <button class="btn big" id="yes">转入${HOUSES[h].name}</button>
            <button class="btn big ghost" id="no">留在${HOUSES[S.house].name}</button></div>`;
          q(box, '#yes').onclick = () => { S.house = h; save(); toast('你现在是' + HOUSES[h].name + '的学生'); back(); };
          q(box, '#no').onclick = back;
        }
      }
      draw();
    }
  };
};

    mount(el) {
      h.mount(el);
      const ov = q(el, '#ov');
      const tick = () => {
        const n = new Date();
        q(el, '#clk').textContent = pad2(n.getHours()) + ':' + pad2(n.getMinutes());
        q(el, '#dt').textContent = `${n.getMonth() + 1}月${n.getDate()}日 星期${WEEK[n.getDay()]}`;
      };
      tick(); every(tick, 1000);
      let y0 = null, dy = 0;
      ov.addEventListener('pointerdown', e => {
        if (e.target.closest('[data-back]')) return;
        y0 = e.clientY; dy = 0; ov.style.transition = 'none'; try { ov.setPointerCapture(e.pointerId); } catch (x) {}
      });
      ov.addEventListener('pointermove', e => {
        if (y0 == null) return;
        dy = Math.min(0, e.clientY - y0); ov.style.transform = `translateY(${dy}px)`;
      });
      const end = () => {
        if (y0 == null) return; y0 = null;
        ov.style.transition = 'transform .26s ease-out';
        if (dy < -window.innerHeight * 0.2) {
          ov.style.transform = 'translateY(-100%)';

        } else { ov.style.transform = 'translateY(0)'; if (Math.abs(dy) < 6) toast('向上滑动解锁'); }
      };

    }
  };
};

/* --- 通话界面 --- */
SCREENS.call = p => {
  const c = charById(p.id);
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let st = p.incoming ? 'ringing' : 'dialing', sec = 0, muted = false, spk = false, busy = false; const hist = [];
  return {
    html: header('通话') + `<div class="callbody ${st === 'connected' ? '' : 'ringing'}" id="cb">${avatar(c, 'xl')}<h2 style="margin:6px 0 0">${esc(c.name)}</h2>
      <div class="soft" id="cs"></div><div class="cap" id="cap">&nbsp;</div><button class="replay" id="rp" style="display:none">🔊 再听一遍</button></div>
      <div class="ctrls" id="ct"></div>
      <form class="composer" id="cf" style="display:none"><input id="ci" placeholder="打字回复…" autocomplete="off"><button class="btn">发送</button></form>`,
    mount(el) {
      const cs = q(el, '#cs'), cap = q(el, '#cap'), ct = q(el, '#ct'), cf = q(el, '#cf'), ci = q(el, '#ci');
      const mmss = () => pad2(Math.floor(sec / 60)) + ':' + pad2(sec % 60);
      const btn = (act, ic, label, cls) => `<button class="cbtn ${cls || ''}" data-act="${act}"><span class="c">${ic}</span>${label}</button>`;
      function draw() {
        q(el, '#cb').classList.toggle('ringing', st !== 'connected');
        cs.textContent = st === 'ringing' ? '来电…' : st === 'dialing' ? '正在呼叫…' : mmss();
        cf.style.display = st === 'connected' ? 'flex' : 'none';
        ct.innerHTML = st === 'ringing' ? btn('hang', '✕', '挂断', 'red') + btn('answer', '✆', '接听', 'green')
          : st === 'dialing' ? btn('hang', '✕', '挂断', 'red')
          : btn('mute', muted ? '🔇' : '🔈', '静音', muted ? 'on' : '') + btn('spk', '📢', '免提', spk ? 'on' : '')
            + (SR ? btn('mic', '🎙', '说话') : '') + btn('hang', '✕', '挂断', 'red');
      }
      let lastLine = '';
      function say(text) { if (st !== 'connected') return; lastLine = text; cap.textContent = text; q(el, '#rp').style.display = 'inline-block'; if (!muted) speak(text, c, spk); }
      q(el, '#rp').onclick = () => { primeSpeech(); if (lastLine) speak(lastLine, c, spk); };
      async function turn(userText, hidden) {
        if (busy) return; busy = true;
        const h = hist.concat([{ r: 'user', c: userText }]);
        if (!hidden) hist.push({ r: 'user', c: userText });
        try {
          const out = await AI.ask({ char: c, card: S.card, house: S.house, rel: rel(c.id), hist: h, api: S.api, mode: 'call' });
          if (st !== 'connected') { busy = false; return; }
          hist.push({ r: 'assistant', c: out.reply }); say(out.reply); applyDelta(c, out);
        } catch (err) { toast(err.message); }
        busy = false;
      }
      function connect() {
        st = 'connected'; sec = 0; draw(); every(() => { sec++; cs.textContent = mmss(); }, 1000);
        turn('(电话接通了,请你自然地先开口说话)', true);
      }
      beforeBack = () => {
        stopSpeak();
        const wasOn = st === 'connected'; st = 'ended';
        if (wasOn && sec > 0) { (S.chats[c.id] = S.chats[c.id] || []).push({ r: 'note', c: '通话 ' + mmss() }); save(); }
        return true;
      };
      ct.onclick = e => {
        const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act;
        if (a === 'hang') back();
        else if (a === 'answer') { primeSpeech(); connect(); }
        else if (a === 'mute') { muted = !muted; if (muted) stopSpeak(); draw(); }
        else if (a === 'spk') { spk = !spk; draw(); toast(spk ? '免提已开(音量调大)' : '免提已关'); }
        else if (a === 'mic' && SR) {
          const r = new SR(); r.lang = 'zh-CN';
          r.onresult = ev => { const t = ev.results[0][0].transcript; ci.value = ''; cap.textContent = '你:' + t; turn(t); };
          r.onerror = () => toast('没能听清,可以直接打字');
          try { r.start(); toast('请说话…'); } catch (err) { toast('麦克风不可用,可以直接打字'); }
        }
      };
      cf.onsubmit = e => { e.preventDefault(); primeSpeech(); const v = ci.value.trim(); if (!v) return; ci.value = ''; cap.textContent = '你:' + v; turn(v); };
      draw();
      if (st === 'dialing') setTimeout(() => { if (st === 'dialing') connect(); }, 2000);
    }
  };
};

/* --- 日历(仿 iOS 系统日历,读取内置 HP 节日表) --- */
SCREENS.calendar = () => {
  const n = new Date(); let y = n.getFullYear(), m = n.getMonth() + 1;
  let sel = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  const same = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  return {
    html: header('日历') + `<div class="ios-cal"><div class="cal-head"><div><small id="yy"></small><b id="mm"></b></div>
      <div class="cal-nav"><button id="pv">‹</button><button id="td" class="today-btn">今天</button><button id="nx">›</button></div></div>
      <div class="cal-week">${WEEK.map(w => `<div>${w}</div>`).join('')}</div><div class="cal-grid" id="cg"></div><div class="cal-events" id="ev"></div></div>`,
    mount(el) {
      function events() {
        const hs = HOLIDAYS.filter(h => h.m === sel.getMonth() + 1 && h.d === sel.getDate());
        q(el, '#ev').innerHTML = `<h4>${sel.getMonth() + 1}月${sel.getDate()}日 星期${WEEK[sel.getDay()]}</h4>` +
          (hs.length ? hs.map(h => `<div class="evt"><i></i><div><b>${h.name}</b><small>全天</small></div></div>`).join('') : '<p class="soft" style="margin:0">无日程</p>');
      }
      function draw() {
        q(el, '#yy').textContent = y + '年'; q(el, '#mm').textContent = m + '月';
        const first = new Date(y, m - 1, 1).getDay(), days = new Date(y, m, 0).getDate();
        const weeks = Math.ceil((first + days) / 7); let s = '';
        for (let i = 0; i < weeks * 7; i++) {
          const d = new Date(y, m - 1, 1 - first + i);
          const hol = HOLIDAYS.some(h => h.m === d.getMonth() + 1 && h.d === d.getDate());
          s += `<button class="cd ${d.getMonth() !== m - 1 ? 'dim' : ''} ${same(d, n) ? 'today' : ''} ${same(d, sel) ? 'sel' : ''} ${hol ? 'hol' : ''}" data-t="${d.getTime()}"><span class="n">${d.getDate()}</span><span class="dot"></span></button>`;
        }
        q(el, '#cg').innerHTML = s; events();
        el.querySelectorAll('.cd').forEach(b => b.onclick = () => { sel = new Date(+b.dataset.t); y = sel.getFullYear(); m = sel.getMonth() + 1; draw(); });
      }
      const step = k => { m += k; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } draw(); };
      q(el, '#pv').onclick = () => step(-1); q(el, '#nx').onclick = () => step(1);
      q(el, '#td').onclick = () => { sel = new Date(n.getFullYear(), n.getMonth(), n.getDate()); y = n.getFullYear(); m = n.getMonth() + 1; draw(); };
      let x0 = null; const g = q(el, '#cg');
      g.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
      g.addEventListener('touchend', e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1); });
      draw();
    }
  };
};

/* --- 分院帽(每周只能测一次) --- */
SCREENS.hat = () => {
  const left = S.sortedAt + 7 * 864e5 - Date.now();
  const ok = left <= 0;
  const when = new Date(S.sortedAt + 7 * 864e5);
  return {
    html: header('分院帽') + `<div class="scroll"><div class="result"><div style="font-size:64px">🎩</div>
      <p class="soft">你现在是</p><h2 class="serif">${S.house ? HOUSES[S.house].name : '未分院'}</h2>
      ${ok ? '<p>想让分院帽再看你一次吗?</p><button class="btn big" id="re">重新测试</button>'
           : `<p class="soft">每周只能测试一次。下次可测试:${when.getMonth() + 1}月${when.getDate()}日 ${pad2(when.getHours())}:${pad2(when.getMinutes())}</p>`}</div></div>`,
    mount(el) { const b = q(el, '#re'); if (b) b.onclick = () => replace('sort', { first: false }); }
  };
};

/* --- 外观 --- */
SCREENS.look = () => ({
  html: header('外观') + `<div class="scroll">${Object.keys(THEMES).map(k =>
    `<button class="row" data-k="${k}"><span class="swatch">${THEMES[k].sw.map(c => `<i style="background:${c}"></i>`).join('')}</span><span class="grow"><b>${THEMES[k].name}</b></span><span>${S.theme === k ? '✓' : ''}</span></button>`).join('')}</div>`,
  mount(el) { el.querySelectorAll('.row').forEach(b => b.onclick = () => { S.theme = b.dataset.k; save(); applyTheme(); render(); }); }
});

/* --- 设置:角色卡 / 接口 / 存档 --- */
SCREENS.settings = () => ({
  html: header('设置') + `<div class="scroll">
    <div class="card"><h3>角色卡</h3>${CARD_FIELDS.map(f => fieldHtml(f, S.card[f[0]])).join('')}
      <p class="soft">学院:${S.house ? HOUSES[S.house].name : '未分院'}(在「分院帽」里更改)</p>
      <button class="btn big" id="sc">保存角色卡</button></div>
    <div class="card"><h3>AI 接口</h3>${fieldHtml(['base', 'API 地址', 'text'], S.api.base)}${fieldHtml(['model', '模型名', 'text'], S.api.model)}
      ${fieldHtml(['key', 'API Key', 'text'], S.api.key).replace('type="text"', 'type="password"')}<button class="btn big" id="sa">保存接口设置</button></div>
    <div class="card"><h3>存档(不含 API Key)</h3><textarea id="ta" placeholder="导出的内容会出现在这里;导入时把存档粘贴到这里"></textarea>
      <button class="btn big" id="ex">导出存档</button><button class="btn big ghost" id="im">导入存档</button></div>
    <div class="card"><h3>账号</h3><button class="btn big danger" id="lo">退出登录(清除 Key)</button></div></div>`,
  mount(el) {
    q(el, '#sc').onclick = () => { const v = collect(el, CARD_FIELDS.map(f => f[0])); if (!v.name) return toast('名字不能为空'); S.card = Object.assign({}, S.card, v); save(); toast('角色卡已保存'); };
    q(el, '#sa').onclick = () => {
      const base = q(el, 'input[data-k="base"]').value.trim(), model = q(el, 'input[data-k="model"]').value.trim(), key = q(el, 'input[data-k="key"]').value.trim();
      if (!key) return toast('Key 不能为空'); S.api = { base, model, key }; save(); toast('接口设置已保存');
    };
    q(el, '#ex').onclick = () => {
      const data = JSON.stringify(Object.assign({}, S, { api: { base: S.api.base, model: S.api.model, key: '' } }));
      const ta = q(el, '#ta'); ta.value = data; ta.select(); toast('已导出,复制保存即可');
    };
    q(el, '#im').onclick = () => {
      try {
        const o = JSON.parse(q(el, '#ta').value);
        if (!o || typeof o !== 'object' || !o.card) throw new Error('bad');
        S = Object.assign(Store.defaults(), o, { api: S.api }); save(); applyTheme(); toast('导入成功'); render();
      } catch (e) { toast('存档格式不对,没有导入'); }
    };
    q(el, '#lo').onclick = logout;
  }
});

boot();
})();

</script>
</body>
</html>
